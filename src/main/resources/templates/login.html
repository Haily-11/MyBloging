<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<head>
    <title>登录 - HailyNotes</title>
    <style>
        .login-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 8px 32px rgba(0, 240, 255, 0.15);
            border: 1px solid rgba(0, 240, 255, 0.2);
            width: 100%;
            max-width: 420px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00f0ff, #7000ff);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }
        
        .login-card:hover {
            box-shadow: 0 12px 40px rgba(0, 240, 255, 0.25);
            transform: translateY(-5px);
            border-color: rgba(0, 240, 255, 0.3);
        }
        
        .login-title {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            color: #ccd6f6;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            letter-spacing: 2px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 10px;
            color: #a8b2d1;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        
        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            background: rgba(5, 8, 17, 0.6);
            color: #ccd6f6;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.2), 0 0 15px rgba(0, 240, 255, 0.1);
            background: rgba(5, 8, 17, 0.8);
        }
        
        .form-control::placeholder {
            color: #8892b0;
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.4);
            background: linear-gradient(135deg, #7000ff, #00f0ff);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #8892b0;
            font-size: 14px;
        }
        
        .login-footer a {
            color: #00f0ff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .login-footer a:hover {
            color: #7000ff;
            text-decoration: none;
            text-shadow: 0 0 8px rgba(112, 0, 255, 0.5);
        }
        
        .error-message {
            background: rgba(255, 0, 110, 0.1);
            border: 1px solid rgba(255, 0, 110, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #ff006e;
            font-size: 14px;
            text-align: center;
        }
        
        .login-icon {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .login-icon i {
            font-size: 72px;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 45%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3));
        }

        .divider::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: 45%;
            height: 1px;
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.3), transparent);
        }
    </style>
</head>
<body>
<div th:fragment="content">
    <div class="login-container">
        <div class="login-card">
            <div class="login-icon">
                <i class="fas fa-fingerprint"></i>
            </div>
            <h2 class="login-title">欢迎回来</h2>
            
            <form method="post" action="/doLogin">
                <div th:if="${param.error}" class="error-message">
                    <i class="fas fa-exclamation-circle"></i> 登录失败，请检查用户名和密码
                </div>
                
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                </div>
                
                <button type="submit" class="btn-login">登 录</button>

                <div class="divider"></div>
                
                <div class="login-footer">
                    仅供管理员访问
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
