<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>首页 - HailyNotes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-pap6Vq5K1mY2q2X6mZ1QjvP0y2QZ+0yGqgZlJ+XJZp2t9K6F5p5s7YcV7Kp3y6e9Zk1Q1b1z0s6Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root{
            --primary-color: #00f0ff;
            --secondary-color: #7000ff;
            --bg: #0f1724;
            --card-bg: rgba(255,255,255,0.03);
            --muted: rgba(255,255,255,0.7);
            --glass: rgba(255,255,255,0.04);
            --radius: 10px;
            --container-max: 1150px;
            --gap: 24px;
        }

        body{
            background: linear-gradient(180deg, #071226 0%, var(--bg) 100%);
            color: #e6eef8;
            margin: 0;
            padding: 20px 16px;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        a{color:var(--primary-color);}

        .main-container{
            max-width:var(--container-max);
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: var(--gap);
            align-items: start;
        }

        .content-area{display:flex;flex-direction:column;gap:20px}

        .post-card{
            background:var(--card-bg);
            padding:18px;
            border-radius:var(--radius);
            box-shadow: 0 6px 18px rgba(2,6,23,0.6);
            display:flex;flex-direction:column;gap:12px;
        }

        .post-header{margin-bottom:6px}
        .post-title{font-size:20px;margin:0}
        .post-title a{color:#fff;text-decoration:none}
        .post-meta{font-size:12px;color:var(--muted)}

        .post-summary{font-size:14px;line-height:1.7;color:rgba(255,255,255,0.85)}

        .post-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,0.04);padding-top:12px;margin-top:8px}

        .read-more{background:linear-gradient(90deg,var(--primary-color),var(--secondary-color));color:#001;padding:6px 12px;border-radius:999px;text-decoration:none;font-weight:600}

        .sidebar{display:flex;flex-direction:column;gap:18px}
        .sidebar-widget{background:var(--glass);padding:14px;border-radius:8px}
        .widget-title{font-size:16px;margin:0 0 10px 0;color:#fff}

        .blogger-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;overflow:hidden;border:2px solid rgba(255,255,255,0.08)}
        .blogger-avatar img{width:100%;height:100%;object-fit:cover;display:block}

        .follow-btn{display:inline-block;background:var(--primary-color);color:#001;padding:8px 18px;border-radius:20px;text-decoration:none;font-weight:600}

        .sidebar-menu a{display:inline-block;margin:4px 6px;padding:6px 10px;background:transparent;border-radius:12px;color:var(--muted);font-size:13px;text-decoration:none}

        .recent-posts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
        .recent-posts li a{color:#fff;text-decoration:none}

        .site-info-item{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}

        .fixed-buttons{position:fixed;bottom:26px;right:26px;display:flex;flex-direction:column;gap:10px;z-index:2000}
        .fixed-btn{width:44px;height:44px;border-radius:50%;background:var(--glass);display:flex;align-items:center;justify-content:center;color:#fff;border:1px solid rgba(255, 255, 255, 0.06);cursor:pointer}
        .fixed-btn:focus{outline:2px solid rgba(0,240,255,0.25)}

        @media(max-width:900px){
            .main-container{grid-template-columns:1fr; padding:0}
            .sidebar{order:2}
        }

        .announcement{background:transparent;padding:0}
        .toc-list{padding-left:0;margin:0}
        .post-card .icons{display:flex;gap:12px;align-items:center}
    </style>
</head>
<body>
<div th:fragment="content">
    <!-- 主内容区 -->
    <div class="main-container">
        <!-- 左侧：文章列表 -->
        <div class="content-area">
            <div th:each="article : ${articles}" class="post-card">
                <div class="post-header">
                    <h2 class="post-title">
                        <a th:href="@{/article/{id}(id=${article.id})}" th:text="${article.title}">文章标题</a>
                    </h2>
                    <div class="post-meta">
                        <span><span th:text="${#temporals.format(article.createTime, 'yyyy-MM-dd')}">2024-01-01</span></span>
                        <span th:if="${article.category}" style="margin-left: 10px;">📂 <span th:text="${article.category}">分类</span></span>
                    </div>
                </div>
                <div class="post-content">
                    <div class="post-summary" th:text="${article.summary} ?: ${#strings.substring(article.content, 0, 150) + '...'}">
                        文章摘要...
                    </div>
                </div>
                <div class="post-footer">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <a th:href="@{/article/{id}(id=${article.id})}" class="read-more">阅读全文</a>
                        <form th:action="@{/article/like/{id}(id=${article.id})}" method="post" style="display: inline;">
                            <button type="submit" style="background: none; border: none; color: #00f0ff; cursor: pointer; font-size: 14px;">
                                ❤️ <span th:text="${article.likeCount}">0</span>
                            </button>
                        </form>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <span>👁️ <span th:text="${article.viewCount}">0</span></span>
                        <span>💬 <span th:text="${article.commentCount}">0</span></span>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(articles)}" class="post-card" style="text-align: center; padding: 60px;">
                <p>暂无文章，<a href="/write">发布第一篇</a></p>
            </div>
        </div>

        <!-- 右侧：侧边栏 -->
        <div class="sidebar">

            <div class="sidebar-widget">
                    <h3 style="color: #00f0ff; font-size: 19px; margin: 0; text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);">
                        Welcome to HailyNotes
                    </h3>
                <div class="blogger-info">
                    <div class="blogger-avatar">
                        <img src=""  loading="lazy">
                    </div>
                    <div class="sidebar-menu" style="margin-top: 15px;">
                        <a href="/articles" style="display: inline-block; margin: 5px; padding: 6px 12px; background: rgba(0, 240, 255, 0.2); color: #00f0ff; border-radius: 12px; font-size: 13px; text-decoration: none;">文章</a>
                        <a href="/articles" style="display: inline-block; margin: 5px; padding: 6px 12px; background: rgba(112, 0, 255, 0.2); color: #7000ff; border-radius: 12px; font-size: 13px; text-decoration: none;">标签</a>
                        <a href="/articles" style="display: inline-block; margin: 5px; padding: 6px 12px; background: rgba(255, 0, 110, 0.2); color: #ff006e; border-radius: 12px; font-size: 13px; text-decoration: none;">分类</a>
                    </div>
                </div>
            </div>

            <div class="sidebar-widget">
                <div class="announcement">
                    <div class="announcement-title">
                        <i class="fas fa-bullhorn"></i> 公告
                    </div>
                    <div class="announcement-content">
                        This is my Blog
                    </div>
                </div>
            </div>

            <div class="sidebar-widget">
                <div class="toc">
                    <div class="toc-title">文章分类</div>
                    <ul class="toc-list">
                        <li th:each="category : ${categories}">
                            <a th:href="@{/articles(category=${category})}" th:text="${category}">分类</a>
                        </li>
                        <!-- null-safe check: if categories is null or empty show placeholder -->
                        <li th:if="${categories == null or #lists.isEmpty(categories)}" style="color: #8892b0;">暂无分类</li>
                    </ul>
                </div>
            </div>

            <!-- 年份/月份归档 -->
            <div class="sidebar-widget">
                <h4 class="widget-title">归档</h4>
                <ul class="archive-list">
                    <li th:each="entry : ${monthArchives}">
                        <a th:href="@{/articles(month=${entry.key})}" th:text="${entry.key}">2024-04</a>
                        (<span th:text="${entry.value}">10</span>)
                    </li>
                </ul>
            </div>

            <div class="sidebar-widget">
                <h3 class="widget-title">最新文章</h3>
                <ul class="recent-posts">
                    <li th:each="article : ${recentArticles}">
                        <a th:href="@{/article/{id}(id=${article.id})}" th:text="${article.title}">文章标题</a>
                        <span th:text="${#temporals.format(article.createTime, 'yyyy-MM-dd')}">日期</span>
                    </li>
                    <li th:if="${#lists.isEmpty(recentArticles)}" style="color: rgba(255, 255, 255, 0.7);">暂无文章</li>
                </ul>
            </div>

            <div class="sidebar-widget">
                <h3 class="widget-title">网站信息</h3>
                <div class="site-info">
                    <div class="site-info-item">
                        <span>文章数目：</span>
                        <span th:text="${totalArticles}">0</span>
                    </div>
                    <div class="site-info-item">
                        <span>总浏览量：</span>
                        <span th:text="${totalViews}">0</span>
                    </div>
                    <div class="site-info-item">
                        <span>总点赞数：</span>
                        <span th:text="${totalLikes}">0</span>
                    </div>
                    <div class="site-info-item">
                        <span>分类数目：</span>
                        <!-- null-safe size: show 0 when categories is null -->
                        <span th:text="${categories == null ? 0 : #lists.size(categories)}">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed-buttons" aria-hidden="false">
        <button class="fixed-btn" id="btn-settings" title="设置" aria-label="设置">
            <i class="fas fa-cog" aria-hidden="true"></i>
        </button>
        <button class="fixed-btn" id="btn-backtop" title="返回顶部" aria-label="返回顶部">
            <i class="fas fa-arrow-up" aria-hidden="true"></i>
        </button>
    </div>

    <script>
        (function(){
            var back = document.getElementById('btn-backtop');
            var settings = document.getElementById('btn-settings');
            if(back){
                back.style.display = 'none';
                window.addEventListener('scroll', function(){
                    if(window.scrollY > 200){ back.style.display = 'flex'; }
                    else { back.style.display = 'none'; }
                });
                back.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
            }
            if(settings){
                settings.addEventListener('click', function(){
                    window.location.href = '/about';
                });
            }
        })();
    </script>
</div>
</body>
</html>
